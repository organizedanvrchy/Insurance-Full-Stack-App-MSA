<main class="auth-page">
  <app-theme-toggle class="theme-corner" />

  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-labelledby="choose-title">
    <app-brand-logo />
    <h1 id="choose-title">Choose a new password</h1>
    <p class="muted">
      An administrator reset your password. Choose a new password to continue.
    </p>

    @if (error(); as e) {
      <div class="alert" role="alert">{{ e }}</div>
    }

    <label class="field">
      New password
      <input type="password" formControlName="newPassword" autocomplete="new-password" [attr.maxlength]="passwordMax" />
      @if (f.newPassword.touched && f.newPassword.hasError('required')) {
        <small class="err">Enter a new password.</small>
      }
    </label>

    <ul class="rules" aria-label="Password requirements">
      @for (r of checks(); track r.id) {
        <li [class.met]="r.ok">
          <span class="mark" aria-hidden="true">{{ r.ok ? '✓' : '○' }}</span>
          {{ r.label }}
          <span class="sr-only">{{ r.ok ? '(met)' : '(not met yet)' }}</span>
        </li>
      }
    </ul>

    <label class="field">
      Confirm new password
      <input type="password" formControlName="confirmNewPassword" autocomplete="new-password" />
      @if (f.confirmNewPassword.touched && form.hasError('mismatch')) {
        <small class="err">The new passwords don't match.</small>
      }
    </label>

    <button class="btn" type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save new password' }}
    </button>
    <button class="link-btn" type="button" (click)="signOut()">Sign out</button>
  </form>
</main>
