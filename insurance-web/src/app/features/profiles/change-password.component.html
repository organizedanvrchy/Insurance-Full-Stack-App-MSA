<section class="panel password" aria-labelledby="password-title">
  <div class="head">
    <h2 id="password-title">Password</h2>
    @if (!open()) {
      <button type="button" class="btn-sm" (click)="start()">Change password</button>
    }
  </div>

  @if (message(); as m) {
    <p class="ok" role="status">{{ m }}</p>
  }

  @if (open()) {
    <form class="form-box" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (error(); as e) {
        <div class="alert" role="alert">{{ e }}</div>
      }

      <label class="field">
        Current password
        <input type="password" formControlName="currentPassword" autocomplete="current-password" />
        @if (f.currentPassword.touched && f.currentPassword.invalid) {
          <small class="err">Enter your current password.</small>
        }
      </label>

      <label class="field">
        New password
        <input type="password" formControlName="newPassword" autocomplete="new-password" [attr.maxlength]="passwordMax" />
        @if (f.newPassword.touched && f.newPassword.hasError('required')) {
          <small class="err">Enter a new password.</small>
        }
      </label>

      <ul class="rules" aria-label="Password requirements">
        @for (r of checks(); track r.id) {
          <li [class.met]="r.ok">
            <span class="mark" aria-hidden="true">{{ r.ok ? '✓' : '○' }}</span>
            {{ r.label }}
            <span class="sr-only">{{ r.ok ? '(met)' : '(not met yet)' }}</span>
          </li>
        }
      </ul>

      <label class="field">
        Confirm new password
        <input type="password" formControlName="confirmNewPassword" autocomplete="new-password" />
        @if (f.confirmNewPassword.touched && form.hasError('mismatch')) {
          <small class="err">The new passwords do not match.</small>
        }
      </label>

      <div class="form-actions">
        <button type="button" class="btn-sm" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-sm primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Change password' }}
        </button>
      </div>
    </form>
  } @else {
    <p class="muted">Change your password.</p>
  }
</section>
