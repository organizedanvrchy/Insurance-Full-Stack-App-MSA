<aside class="panel">
  <div class="leaves" aria-hidden="true">
    @for (l of leaves; track l.left) {
    <span class="leaf" [class.alt]="l.alt" [style.left.%]="l.left" [style.width.px]="l.size" [style.height.px]="l.size"
      [style.--leaf-color]="l.color" [style.animation-delay.s]="l.delay" [style.animation-duration.s]="l.duration"></span>
    }
  </div>

  <div class="content">
    <app-brand-logo size="lg" />
    <p class="slogan">{{ slogan }}</p>
    <p class="sub">
      Get a personalized quote in minutes, manage your premiums in one place and file claims
      without the paperwork.
    </p>
    <ul class="points">
      @for (p of points; track p) {
      <li>{{ p }}</li>
      }
    </ul>
  </div>
</aside>
