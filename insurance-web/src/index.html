<!doctype html>
<html lang="en">
<head>
  <script>
    // Set the theme before first paint so dark-mode users never see a white flash.
    // Mirrors the logic in ThemeService
    (function () {
      try {
        var saved = localStorage.getItem('ins_theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <title>KVB Insurance | Rain or shine, you’re covered</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
