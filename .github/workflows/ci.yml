name: CI

# Runs on every pull request, and on every push to main (that is, after a merge).
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Compile every service and run the .NET unit tests (no database or Docker needed).
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Insurance.sln -c Release
      - run: dotnet test Insurance.sln -c Release --no-build

  # 2. Run the Angular unit tests and build the app the way production does.
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24                       # Angular 22 needs Node 24.15+ (or 22.22.3+)
          cache: npm
          cache-dependency-path: insurance-web/package-lock.json
      - run: npm ci                              # like npm install, but exactly what package-lock.json says
      - run: npx ng test --watch=false
      - run: npx ng build

  # 3. Build every Docker image, start the whole system, and test it through the gateway.
  end-to-end:
    name: End-to-end (Docker Compose)
    needs: backend                               # no point starting containers if the unit tests fail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway values for this run only. Every docker compose command reads both (the compose file
      # requires them), and the test script uses SA_PASSWORD to promote its admin.
      SA_PASSWORD: Ci_Only_Passw0rd!
      JWT_KEY: ci-only-signing-key-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml up --build -d
      - name: Run the end-to-end test
        run: python3 tests/e2e/e2e_test.py
      - name: Show the service logs
        if: failure()                            # only when something went wrong, to see why
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v