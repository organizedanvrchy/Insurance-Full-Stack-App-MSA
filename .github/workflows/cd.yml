name: CD

# Delivery: after CI passes on main, publish a Docker image of every service to GitHub Container Registry (ghcr.io)
# and the built Angular app as a downloadable artifact. Can also be started by hand (Actions tab, any branch).
#
# Azure deployment (optional): when the repository variable AZURE_CONTAINER_REGISTRY is set, the same images are also
# pushed to that Azure Container Registry, every container app is switched to them, and the Angular app is deployed
# to the Static Web App. One-time setup: deploy/azure/README.md, "Continuous deployment". Without the variable, those
# steps are skipped and the workflow does exactly what it did before.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write                                # needed to push images to ghcr.io
  id-token: write                                # lets azure/login sign in to Azure without a stored password (OIDC);
                                                 # Azure trusts runs from main (and the branches set up for it)

# Never two publishes at once; a newer one waits instead of cancelling the one in progress.
concurrency:
  group: cd
  cancel-in-progress: false

env:
  # The commit that was tested (workflow_run), or the latest commit of the chosen branch (started by hand).
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  AZURE_ENABLED: ${{ vars.AZURE_CONTAINER_REGISTRY != '' }}

jobs:
  images:
    name: Image (${{ matrix.service }})
    # Only when CI succeeded for a push to main (a merge), or when started by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                           # one image failing doesn't stop the others
      matrix:                                    # one job per deployable, all running in parallel
        include:
          - { service: identity,      assembly: Insurance.Identity,      project: src/Services/Identity/Insurance.Identity/Insurance.Identity.csproj }
          - { service: catalog,       assembly: Insurance.Catalog,       project: src/Services/Catalog/Insurance.Catalog/Insurance.Catalog.csproj }
          - { service: quotes,        assembly: Insurance.Quotes,        project: src/Services/Quotes/Insurance.Quotes/Insurance.Quotes.csproj }
          - { service: enrollments,   assembly: Insurance.Enrollments,   project: src/Services/Enrollments/Insurance.Enrollments/Insurance.Enrollments.csproj }
          - { service: billing,       assembly: Insurance.Billing,       project: src/Services/Billing/Insurance.Billing/Insurance.Billing.csproj }
          - { service: claims,        assembly: Insurance.Claims,        project: src/Services/Claims/Insurance.Claims/Insurance.Claims.csproj }
          - { service: notifications, assembly: Insurance.Notifications, project: src/Services/Notifications/Insurance.Notifications/Insurance.Notifications.csproj }
          - { service: gateway,       assembly: Insurance.Gateway,       project: src/Gateway/Insurance.Gateway/Insurance.Gateway.csproj }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Short commit id for the image tag
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # provided automatically; no secret to create

      - name: Sign in to Azure
        if: env.AZURE_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to the Azure container registry
        if: env.AZURE_ENABLED == 'true'
        id: acr
        run: |
          az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"
          echo "server=$(az acr show --name '${{ vars.AZURE_CONTAINER_REGISTRY }}' --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      # latest = newest tested main; sha-<commit> = this exact version, kept so you can go back to it.
      - name: Image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/insurance-${{ matrix.service }}:latest"
            echo "ghcr.io/${{ github.repository_owner }}/insurance-${{ matrix.service }}:sha-${{ steps.commit.outputs.short }}"
            if [ -n "${{ steps.acr.outputs.server }}" ]; then
              echo "${{ steps.acr.outputs.server }}/${{ matrix.service }}:latest"
              echo "${{ steps.acr.outputs.server }}/${{ matrix.service }}:sha-${{ steps.commit.outputs.short }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Links the package to this repository (so it shows on the repo page and shares its access).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          # Reuse layers from the previous run: much faster when only a little changed.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  frontend:
    name: Angular build
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: insurance-web/package-lock.json
      - run: npm ci
      - run: npx ng build                        # production configuration: uses environment.ts
      - uses: actions/upload-artifact@v4
        with:
          name: insurance-web
          path: insurance-web/dist/insurance-web
          retention-days: 30

  # Switches every container app to the images just pushed. Each app starts a new revision; the old one keeps
  # serving until the new one is healthy. Services first, the gateway last.
  deploy-services:
    name: Deploy services to Azure
    needs: images
    if: vars.AZURE_CONTAINER_REGISTRY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Short commit id
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update the container apps
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          TAG: sha-${{ steps.commit.outputs.short }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          server=$(az acr show --name "$ACR" --query loginServer -o tsv)
          for app in identity catalog quotes enrollments billing claims notifications gateway; do
            echo "::group::$app -> $server/$app:$TAG"
            az containerapp update --resource-group "$RG" --name "$app" --image "$server/$app:$TAG" -o none
            echo "::endgroup::"
          done

  deploy-web:
    name: Deploy the website to Azure
    needs: [frontend, deploy-services]           # after the API it talks to
    if: vars.AZURE_CONTAINER_REGISTRY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: insurance-web
          path: site
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site/browser             # already built: upload as is
          skip_app_build: true
          skip_api_build: true
